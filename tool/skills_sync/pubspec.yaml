name: skills_sync
description: >-
  Generates the umbrella package's copies of its dependencies' agent skills
  and fails when a copy has drifted from its source.
publish_to: none

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  package_config: ^3.0.0
  path: ^1.9.1
  skills_lint: ^0.5.3+1
  yaml: ^3.1.4

dev_dependencies:
  test: ^1.33.0
  very_good_analysis: ^11.0.0
