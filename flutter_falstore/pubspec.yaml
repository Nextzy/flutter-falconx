name: flutter_falstore
description: A secure storage solution for Flutter applications with comprehensive error handling and batch operations.
version: 1.0.0
publish_to: none

environment:
  sdk: ">=3.9.0 <4.0.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

  flutter_faltool:
    path: ../flutter_faltool

  # PLATFORM: All
  ansicolor: ^2.0.3
  flutter_secure_storage: ^9.2.4

dev_dependencies:
  build_runner: ^2.10.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.0.0
