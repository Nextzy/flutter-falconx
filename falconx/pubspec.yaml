name: falconx
description: A FalconX package project.
version: 3.11.0
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  faltool:
    path: ../faltool
  falkit:
    path: ../falkit
  falmodel:
    path: ../falmodel
  falconnect:
    path: ../falconnect
  falstore:
    path: ../falstore

  #PLATFORM: All
  provider: ^6.1.5
  ansicolor: ^2.0.3

  #PLATFORM: Android, iOS, Linux, MacOS
  flutter_local_notifications: ^19.3.1

  #======= Utils ========#
  #PLATFORM: All
  flutter_bloc: ^9.1.1
  bloc_concurrency: ^0.3.0
  app_links: ^6.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  very_good_analysis: ^9.0.0
