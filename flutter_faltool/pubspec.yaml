name: flutter_faltool
description: A tools library for Flutter.
version: 1.0.0
publish_to: none

environment:
  sdk: ">=3.13.0"

resolution: workspace

dependencies:
  dart_faltool:
    git:
      url: https://github.com/Nextzy/dart-falconx
      ref: 2.3.1
      path: dart_faltool

  flutter:
    sdk: flutter

  #PLATFORM: All
  ansicolor: ^2.0.3
  device_info_plus: ^13.2.0
  package_info_plus: ^10.2.1
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  leak_tracker: ^11.0.2
  flutter_udid: ^4.1.6
  rate_limiter: ^1.1.1

  #PLATFORM: Android, iOS, Linux, MacOS, Windows
  path: ^1.9.1
  path_provider: ^2.1.6

  #PLATFORM: Android, iOS, MacOS, Web
  flutter_image_compress: ^2.5.1

dev_dependencies:
  build_runner: ^2.16.1
  flutter_gen_runner: ^5.15.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0
