name: faltool
description: A tools library for Flutter.
version: 1.0.13
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  falmodel:
    path: ../falmodel

  #PLATFORM: All
  ansicolor: ^2.0.3
  crypto: ^3.0.6
  dartx: ^1.2.0
  device_info_plus: ^11.5.0
  enum_to_string: ^2.2.1
  equatable: ^2.0.7
  fpdart: ^1.1.1
  freezed_annotation: ^3.1.0
  intl: ^0.20.2
  json_annotation: ^4.9.0
  logger: ^2.6.1
  numeral: ^3.1.1
  package_info_plus: ^8.3.0
  retry: ^3.1.2
  rxdart: ^0.28.0
  share_plus: ^11.0.0
  shared_preferences: ^2.5.3
  stack_trace: ^1.12.1
  timeago: ^3.7.1
  url_strategy: ^0.3.0
  uuid: ^4.5.1
  version: ^3.0.2

  #PLATFORM: Android, iOS, Linux, MacOS, Windows
  path: ^1.9.1
  path_provider: ^2.1.5
  universal_io: ^2.2.2

  #PLATFORM: Android, iOS, MacOS, Web
  flutter_image_compress: ^2.4.0

dev_dependencies:
  build_runner: ^2.5.4
  flutter_gen_runner: ^5.11.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  very_good_analysis: ^9.0.0
