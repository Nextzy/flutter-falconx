name: falstore
description: A secure storage solution for Flutter applications with comprehensive error handling and batch operations.
version: 1.1.10
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  faltool:
    path: ../faltool

  # PLATFORM: All
  ansicolor: ^2.0.3
  flutter_secure_storage: ^9.2.4


dev_dependencies:
  build_runner: ^2.5.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  very_good_analysis: ^9.0.0
